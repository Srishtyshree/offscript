[project]
name = "offscript-contract"
version = "0.1.0"
description = "Shared API and router-output schemas for Offscript."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offscript_contract"]
