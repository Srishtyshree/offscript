[project]
name = "offscript-training"
version = "0.1.0"
description = "Offscript datasets, Tinker LoRA fine-tuning and evaluation (offline only)."
requires-python = ">=3.11"
# Never import offscript_api.
dependencies = [
    "offscript-contract",
    "tinker>=0.33.1",
    "tinker-cookbook>=0.5.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offscript_training"]
